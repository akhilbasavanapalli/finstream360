name: FinStream360 CD — Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "notebooks/**"
      - "snowflake/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options: [dev, staging, prod]

env:
  ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}

jobs:
  # ── Terraform Apply ────────────────────────────────────────────────────────
  terraform-deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan -var="environment=prod"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

  # ── Deploy Databricks Notebooks ────────────────────────────────────────────
  deploy-notebooks:
    name: Deploy Notebooks to Databricks
    runs-on: ubuntu-latest
    needs: terraform-deploy
    env:
      DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: pip install databricks-cli

      - name: Deploy notebooks
        run: |
          databricks workspace import_dir notebooks/ \
            /finstream360/notebooks \
            --overwrite

      - name: Run Bronze ingestion job
        run: |
          databricks jobs run-now \
            --job-id ${{ secrets.DBX_BRONZE_JOB_ID }}

  # ── Deploy Snowflake DDL ────────────────────────────────────────────────────
  deploy-snowflake:
    name: Deploy Snowflake DDL
    runs-on: ubuntu-latest
    needs: terraform-deploy
    steps:
      - uses: actions/checkout@v4

      - name: Install SnowSQL
        run: |
          curl -o snowsql.bash \
            https://sfc-repo.snowflakecomputing.com/snowsql/bootstrap/1.2/linux_x86_64/snowsql-1.2.32-linux_x86_64.bash
          bash snowsql.bash

      - name: Run DDL migrations
        env:
          SNOWSQL_ACCOUNT:  ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWSQL_USER:     ${{ secrets.SNOWFLAKE_USER }}
          SNOWSQL_PWD:      ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWSQL_ROLE:     SYSADMIN
          SNOWSQL_DATABASE: FINSTREAM360
        run: |
          ~/bin/snowsql -f snowflake/01_schemas_ddl.sql
          ~/bin/snowsql -f snowflake/02_stored_procedures.sql
          echo "Snowflake DDL deployed successfully"
