[tool.black]
line-length = 120
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | dist
  | build
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["*.egg-info/*", ".git/*", "venv/*", ".venv/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501", "E402", "F401", "F811", "W291"]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["F821", "F401", "E501"]   # dbutils/spark/display are Databricks builtins
"data_generation/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
